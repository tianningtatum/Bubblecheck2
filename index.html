<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>BubbleCheck</title>
<style>
:root{--bg:#f3f2ed;--card:#fff;--ink:#1c2220;--muted:#66706b;--line:#dcdad2;--accent:#1f6f4a;--accent-ink:#fff;--soft:#e7f1eb;--bad:#c0392b;--bad-soft:#fbe9e7;--warn:#a86a12;--good:#1d8048;--blue:#2563c9}
@media (prefers-color-scheme:dark){:root{--bg:#121514;--card:#1b201e;--ink:#e8ece9;--muted:#98a39d;--line:#2d3431;--accent:#46b67d;--accent-ink:#0b1a12;--soft:#1d3127;--bad:#ef6b5c;--bad-soft:#3a1f1c;--good:#4cc283;--blue:#6aa1ff}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;letter-spacing:.2px}
header.top .dot{width:22px;height:22px;border-radius:50%;background:var(--ink);box-shadow:inset 0 0 0 4px var(--bg),0 0 0 2px var(--ink)}
header.top .sub{margin-left:auto;color:var(--muted);font-size:13px}
main{max-width:880px;margin:0 auto;padding:14px 16px 96px}
section.view{display:none}section.view.on{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 9px;font:600 12px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--accent)}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 13px;font:600 14px system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.btn.block{width:100%;justify-content:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
label.f>span{display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:600}
.chip.warn{background:#fff3dc;color:var(--warn)}
@media (prefers-color-scheme:dark){.chip.warn{background:#3a2d14}}
.qcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
/* scan */
.stage{position:relative;background:#0d0f0e;border-radius:12px;overflow:hidden;min-height:240px}
.stage canvas{display:block;width:100%;height:auto}
.stage #ov{position:absolute;inset:0;width:100%;height:100%}
.stage video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
.stage .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#cfd6d2;text-align:center;padding:20px}
.stage .hint{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:13px;text-align:center}
.scanbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.res{display:flex;gap:14px;align-items:center}
.res .big{font-size:30px;font-weight:800;letter-spacing:-.5px;min-width:86px}
.res .big small{font-size:15px;color:var(--muted);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.toggle input{width:auto}
/* key editor */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:4px 14px}
.krow{display:flex;align-items:center;gap:5px;padding:3px 0}
.krow .n{width:28px;text-align:right;font-weight:700;color:var(--muted);font-size:13px}
.kb{width:31px;height:31px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 13px system-ui,sans-serif;padding:0}
.kb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* results */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 6px}
table.t td{border-bottom:1px solid var(--line);padding:9px 6px}
table.t tr.click{cursor:pointer}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:19px}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.lo{background:var(--bad)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.acell{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:13px}
.acell .n{font-weight:700;width:24px;text-align:right;color:var(--muted)}
.acell select{padding:3px 4px;width:52px}
.acell.ok{border-color:var(--good);background:var(--soft)}
.acell.no{border-color:var(--bad);background:var(--bad-soft)}
.acell .k{font-size:11px;color:var(--muted)}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--bg);width:100%;max-width:880px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){#modal{align-items:center}#modal .box{border-radius:16px;max-height:88vh}}
#modal .mh{display:flex;align-items:center;gap:8px;margin-bottom:12px;position:sticky;top:-16px;background:var(--bg);padding:6px 0;z-index:1}
#modal .mh h2{margin:0;flex:1}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}#toast.bad{background:var(--bad);color:#fff}
.help p,.help li{font-size:14px}.help ol{padding-left:20px}
.sheet-preview{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;overflow:hidden}
.sheet-preview svg{width:100%;height:auto;display:block}
#print-area{display:none}
@page{size:auto;margin:8mm}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block}
  .pg{page-break-after:always;break-after:page;display:flex;flex-direction:column;align-items:center}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .cut{width:100%;border-top:1px dashed #999;margin:1.5mm 0}
  .rep{font:10.5pt Arial,Helvetica,sans-serif;color:#000}
  .rep h1{font-size:15pt;margin:0 0 2mm}
  .rep h2{font-size:12pt;margin:5mm 0 2mm}
  .rep table{width:100%;border-collapse:collapse}
  .rep th,.rep td{border:1px solid #999;padding:1.2mm 1.8mm;text-align:left}
  .rep td.num,.rep th.num{text-align:right}
  .rep tr{break-inside:avoid}
  .rep .ans{font-family:"Courier New",monospace;font-size:9pt;letter-spacing:.5px;word-break:break-all}
  .rep .ans .x{color:#c00;font-weight:bold;text-decoration:underline}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<header class="top"><div class="dot"></div><h1>BubbleCheck</h1><span class="sub" id="hdrSub"></span></header>

<main>
  <section class="view" id="v-quizzes"></section>

  <section class="view" id="v-scan">
    <div class="row" style="margin-bottom:10px">
      <select id="scanQuiz" style="flex:1"></select>
    </div>
    <div class="stage" id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="cam" width="640" height="480"></canvas>
      <canvas id="ov" width="640" height="480"></canvas>
      <div class="ph" id="ph">
        <div style="font-weight:700;font-size:16px">Scan answer sheets</div>
        <div class="small">Hold the phone flat over the sheet so all 4 black corner squares are visible.</div>
        <div class="row" style="justify-content:center">
          <button class="btn pri" data-act="camStart" id="camStartBtn">Start live camera</button>
          <button class="btn" data-act="snap" id="snapBtn">Take photo of sheet</button>
          <button class="btn" data-act="lib">Choose from Photos</button>
        </div>
        <div class="small" id="camMsg" style="display:none;background:rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;max-width:420px"></div>
      </div>
      <div class="hint" id="hint" style="display:none"></div>
    </div>
    <div class="scanbar">
      <label class="toggle"><input type="checkbox" id="autoSave"> Auto-save</label>
      <button class="btn sm" data-act="snap">Photo</button>
      <button class="btn sm" data-act="lib">From Photos</button>
      <button class="btn sm" data-act="torch" id="torchBtn" style="display:none">Flash</button>
      <button class="btn sm" data-act="camStop" id="stopBtn" style="display:none">Stop camera</button>
      <span class="muted small" id="sessCount" style="margin-left:auto"></span>
    </div>
    <div id="keyModeBanner" class="card" style="display:none;border-color:var(--warn)">
      <div class="spread"><b>Answer key mode</b><button class="btn sm" data-act="cancelKeyMode">Cancel</button></div>
      <div class="small muted">Scan a sheet you filled in with the correct answers. It becomes this quiz's key.</div>
    </div>
    <div id="lastRes"></div>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="libIn" accept="image/*" hidden>
  </section>

  <section class="view" id="v-results"></section>
  <section class="view" id="v-more"></section>
</main>

<nav class="tabs">
  <button data-tab="quizzes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Quizzes</button>
  <button data-tab="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.5"/></svg>Scan</button>
  <button data-tab="results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Results</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/></svg>Roster &amp; data</button>
</nav>

<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="print-area"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
/* =================== storage =================== */
const STORE = 'bubblecheck.v1';
const LETTERS = 'ABCDE';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function blankDB(){ return {quizzes: [], results: [], roster: {}, settings: {autoSave: true, th: 0.25}}; }
function loadDB(){
  try{
    const s = localStorage.getItem(STORE);
    if (s){ const d = JSON.parse(s); const b = blankDB(); return {...b, ...d, settings: {...b.settings, ...(d.settings || {})}}; }
  }catch(e){}
  return blankDB();
}
let DB = loadDB();
let storageOK = true;
function persist(){
  try{ localStorage.setItem(STORE, JSON.stringify(DB)); storageOK = true; }
  catch(e){ storageOK = false; toast('Could not save in this browser. Download a backup from "Roster & data".', true); }
}
const quizById = id => DB.quizzes.find(q => q.id === id);
const resultsFor = qid => DB.results.filter(r => r.quizId === qid);

/* =================== sheet geometry (millimetres) =================== */
const BR = 2.1, PITCH = 5.6;
function layout(q){
  const half = q.size === 'half';
  const W = 170, H = half ? 118 : 240, d = q.idDigits, ch = q.choices, n = q.n;
  const L = {W, H, half, id: [], q: [], qlab: [], code: [], lines: []};
  for (let i = 0; i < 16; i++) L.code.push({x: 40 + 6 * i, y: 0});
  const lab = half ? 13.5 : 18.5;
  L.idLabelY = lab; L.idBoxY = lab + 1.5; L.idX0 = 8;
  for (let c = 0; c < d; c++){
    const col = [];
    for (let r = 0; r < 10; r++) col.push({x: L.idX0 + c * PITCH + PITCH / 2, y: lab + 11 + r * PITCH});
    L.id.push(col);
  }
  let cols, qx0, qx1 = 168, qy0;
  if (!half){ cols = n <= 12 ? 1 : n <= 40 ? 2 : n <= 75 ? 3 : 4; qx0 = 2; qy0 = 92; }
  else { cols = n <= 15 ? 1 : 2; qx0 = 4 + Math.max(d * PITCH, 52) + 6; qy0 = 16; }
  const rows = Math.ceil(n / cols), slot = (qx1 - qx0) / cols, colW = 8 + ch * PITCH;
  for (let i = 0; i < n; i++){
    const c = Math.floor(i / rows), r = i % rows;
    const x0 = qx0 + c * slot + (slot - colW) / 2, y = qy0 + r * PITCH + Math.floor(r / 5) * 1.6;
    L.qlab.push({x: x0 + 6.6, y});
    L.q.push(Array.from({length: ch}, (_, k) => ({x: x0 + 8 + k * PITCH + PITCH / 2, y})));
  }
  if (!half){
    const lx = d > 0 ? L.idX0 + d * PITCH + 10 : 8;
    L.lines = ['Name', 'Section', 'Date', 'Score'].map((t, i) => ({t, x: lx, x2: 166, y: 33 + i * 11}));
    L.markX = lx; L.markY = 79;
  } else {
    const y0 = d > 0 ? 88 : 24, x2 = qx0 - 5;
    L.lines = ['Name', 'Section', 'Date'].map((t, i) => ({t, x: 4, x2, y: y0 + i * 10}));
  }
  return L;
}
function codeValue(q){ return (q.n << 6) | ((q.choices === 5 ? 1 : 0) << 5) | ((q.size === 'half' ? 1 : 0) << 4) | q.idDigits; }
function codeBits(q){
  const v = codeValue(q), b = [1]; let p = 0;
  for (let i = 12; i >= 0; i--){ const t = (v >> i) & 1; b.push(t); p ^= t; }
  b.push(p); b.push(0); return b;
}
function parseCode(bits){
  if (bits[0] !== 1 || bits[15] !== 0) return null;
  let v = 0, p = 0;
  for (let i = 1; i <= 13; i++){ v = (v << 1) | bits[i]; p ^= bits[i]; }
  if (p !== bits[14]) return null;
  const f = {n: v >> 6, choices: (v >> 5 & 1) ? 5 : 4, size: (v >> 4 & 1) ? 'half' : 'full', idDigits: v & 15};
  if (f.n < 1 || f.n > 100 || f.idDigits > 10 || (f.size === 'half' && f.n > 30)) return null;
  return f;
}
const sameFormat = (f, q) => f.n === q.n && f.choices === q.choices && f.size === q.size && f.idDigits === q.idDigits;
const fmtLabel = f => `${f.n} items, A–${LETTERS[f.choices - 1]}, ${f.idDigits}-digit ID, ${f.size === 'half' ? 'half page' : 'full page'}`;

function sheetSVG(q){
  const L = layout(q), pad = 5, vw = L.W + 2 * pad, vh = L.H + 2 * pad;
  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pad} ${-pad} ${vw} ${vh}" width="${vw}mm" height="${vh}mm" font-family="Arial,Helvetica,sans-serif">`);
  o.push(`<rect x="${-pad}" y="${-pad}" width="${vw}" height="${vh}" fill="#fff"/>`);
  for (const [x, y] of [[0, 0], [L.W, 0], [L.W, L.H], [0, L.H]]) o.push(`<rect x="${x - 4}" y="${y - 4}" width="8" height="8" fill="#000"/>`);
  codeBits(q).forEach((b, i) => { if (b) o.push(`<rect x="${L.code[i].x - 2}" y="-2" width="4" height="4" fill="#000"/>`); });
  const title = q.name.length > 60 ? q.name.slice(0, 58) + '…' : q.name;
  o.push(`<text x="${L.W / 2}" y="${L.half ? 8.6 : 9}" font-size="${L.half ? 4 : 4.4}" font-weight="700" text-anchor="middle">${esc(title)}</text>`);
  if (!L.half) o.push(`<text x="${L.W / 2}" y="13.6" font-size="2.6" fill="#444" text-anchor="middle">${q.n} items · Use a dark pencil or pen · Fill each bubble completely · Do not fold</text>`);
  if (L.id.length){
    o.push(`<text x="${L.idX0}" y="${L.idLabelY}" font-size="2.6" font-weight="700">STUDENT ID</text>`);
    L.id.forEach((col, c) => {
      o.push(`<rect x="${col[0].x - 2.6}" y="${L.idBoxY}" width="5.2" height="5.5" fill="none" stroke="#000" stroke-width="0.25"/>`);
      col.forEach((b, r) => {
        o.push(`<circle cx="${b.x}" cy="${b.y}" r="${BR}" fill="none" stroke="#000" stroke-width="0.25"/><text x="${b.x}" y="${b.y + 0.85}" font-size="2.4" fill="#8a8a8a" text-anchor="middle">${r}</text>`);
      });
    });
  }
  for (const ln of L.lines){
    o.push(`<text x="${ln.x}" y="${ln.y}" font-size="2.9">${ln.t}</text><line x1="${ln.x + (ln.t.length * 1.75 + 2)}" y1="${ln.y + 0.6}" x2="${ln.x2}" y2="${ln.y + 0.6}" stroke="#000" stroke-width="0.25"/>`);
  }
  if (!L.half){
    const x = L.markX;
    o.push(`<text x="${x}" y="${L.markY}" font-size="2.6" fill="#444">Mark like this:</text><circle cx="${x + 21}" cy="${L.markY - 0.9}" r="1.9" fill="#222"/>`);
    o.push(`<text x="${x + 27}" y="${L.markY}" font-size="2.6" fill="#444">Not like this:</text>`);
    const cx = x + 47, cy = L.markY - 0.9;
    o.push(`<circle cx="${cx}" cy="${cy}" r="1.9" fill="none" stroke="#000" stroke-width="0.25"/><path d="M${cx - 1.2} ${cy} l0.9 1 l1.6 -2" fill="none" stroke="#222" stroke-width="0.4"/>`);
    o.push(`<circle cx="${cx + 5.5}" cy="${cy}" r="1.9" fill="none" stroke="#000" stroke-width="0.25"/><path d="M${cx + 4.3} ${cy - 1.2} l2.4 2.4 M${cx + 6.7} ${cy - 1.2} l-2.4 2.4" fill="none" stroke="#222" stroke-width="0.4"/>`);
  }
  L.q.forEach((row, i) => {
    o.push(`<text x="${L.qlab[i].x}" y="${L.qlab[i].y + 1}" font-size="2.8" font-weight="700" text-anchor="end">${i + 1}</text>`);
    row.forEach((b, k) => o.push(`<circle cx="${b.x}" cy="${b.y}" r="${BR}" fill="none" stroke="#000" stroke-width="0.25"/><text x="${b.x}" y="${b.y + 0.85}" font-size="2.4" fill="#8a8a8a" text-anchor="middle">${LETTERS[k]}</text>`));
  });
  o.push(`<text x="${L.W / 2}" y="${L.H + 1}" font-size="2" fill="#999" text-anchor="middle">BubbleCheck</text>`);
  o.push('</svg>');
  return o.join('');
}

/* =================== image processing =================== */
function toGray(ctx, w, h){
  const d = ctx.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
  return g;
}
function findBlobs(g, w, h){
  const W1 = w + 1, I = new Uint32Array(W1 * (h + 1));
  for (let y = 0; y < h; y++){
    let row = 0;

function gradeSheet(G, Hm, q, th){
  const L = layout(q), black = fidBlack(G, Hm, L.W, L.H);

  };
  const decide = arr => {
    let mx = -1, mi = -1, mn = 9;
    arr.forEach((d, i) => { if (d > mx){ mx = d; mi = i; } if (d < mn) mn = d; });
    if (mx < th || mx - mn < 0.15) return -1;

  const answers = qDark.map(r => { const k = decide(r); return k >= 0 ? LETTERS[k] : k === -2 ? '*' : ''; });

}

function scoreOf(q, answers){
  let s = 0, t = 0, wrong = 0, blank = 0, multi = 0;
  for (let i = 0; i < q.n; i++){
    const k = q.key[i]; if (!k) continue; t++;
    const a = answers[i] || '';
    if (a.length === 1 && a !== '*' && k.includes(a)) s++;
    else if (!a) blank++; else if (a === '*') multi++; else wrong++;
  }
  return {s, t, wrong, blank, multi, pct: t ? s / t * 100 : 0};
}
const isRight = (q, i, a) => !!(q.key[i] && a && a.length === 1 && a !== '*' && q.key[i].includes(a));

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, bad) => setTimeout(() => bad({name: 'Timeout'}), ms))]);
async function camStart(){

    {audio: false, video: {facingMode: 'environment'}},
    {audio: false, video: true}];

    try{ S.stream = await withTimeout(navigator.mediaDevices.getUserMedia(c), 12000); err = null; break; }
    catch(e){ err = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError' || e.name === 'Timeout') break; }
  }
  if (!S.stream){
    const n = err && err.name;
    camMsg(n === 'NotAllowedError' ? '<b>Camera permission was denied.</b> Allow camera for this page in your browser\'s site settings and try again — or use <b>Take photo of sheet</b>.'

      : n === 'Timeout' || n === 'SecurityError' ? NO_LIVE_MSG
      : `<b>Couldn't start the camera</b> (${esc(n || 'unknown error')}). Use <b>Take photo of sheet</b> instead.`);
    return;

  video.srcObject = S.stream;

function sizeCanvases(w, h){

function loop(now){
  if (!S.running) return;
  requestAnimationFrame(loop);
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  if (now < S.frozenUntil) return;
  const s = Math.min(1, LO_MAX / Math.max(vw, vh)), lw = Math.round(vw * s), lh = Math.round(vh * s);
  sizeCanvases(lw, lh);

// Analyse what's currently in the preview canvas; grade at higher resolution from `src`.
function analyze(src, sw, sh){
  const q = quizById(currentQuizId()); if (!q) return {err: 'noquiz'};
  const lw = cam.width, lh = cam.height;
  const G = {g: toGray(camCtx, lw, lh), w: lw, h: lh};
  const det = detectSheet(G, q);
  if (!det) return {err: 'nosheet'};
  if (!sameFormat(det.fmt, q)) return {err: 'format', det, q};
  const s = Math.min(1, HI_MAX / Math.max(sw, sh)), hw = Math.round(sw * s), hh = Math.round(sh * s);
  hiC.width = hw; hiC.height = hh; hiCtx.drawImage(src, 0, 0, hw, hh);
  const GH = {g: toGray(hiCtx, hw, hh), w: hw, h: hh}, k = hw / lw, Hh = det.Hm.slice();
  for (let i = 0; i < 6; i++) Hh[i] *= k;
  const res = gradeSheet(GH, Hh, q, DB.settings.th || 0.25);
  return {det, res, q};
}
function liveStep(vw, vh, now){
  const A = analyze(video, vw, vh);
  if (A.err){
    S.miss++; S.stableN = 0; S.stableKey = '';
    if (S.miss >= 3) S.armed = true;
    if (A.err === 'format'){ drawOverlay(A.det, null, null); hint(formatMsg(A.det.fmt, A.q)); }
    else { clearOverlay(); hint(S.armed ? 'Fit all 4 corner squares in view' : 'Saved ✓ — next sheet'); }
    return;
  }
  S.miss = 0;
  const key = A.res.sid + '|' + A.res.answers.join(',');
  if (key === S.stableKey) S.stableN++; else { S.stableKey = key; S.stableN = 1; }
  drawOverlay(A.det, A.res, A.q);
  if (S.keyMode){
    if (S.stableN >= 3){ applyScannedKey(A); S.frozenUntil = now + 1200; }
    else hint('Hold still…');
    return;
  }
  const differentStudent = sidOk(A.res.sid) && A.res.sid !== S.lastSavedSid;
  if (!S.armed && !differentStudent){ hint('Already saved — remove sheet or show the next one'); return; }
  if (S.stableN < 3){ hint('Hold still…'); return; }
  S.pending = {quizId: A.q.id, sid: A.res.sid, answers: A.res.answers};
  if (DB.settings.autoSave !== false){
    savePending(true);
    S.frozenUntil = now + 1300; S.armed = false;
    hint('Saved ✓ — next sheet');
  } else {
    S.frozenUntil = now + 1e9; // hold frame until user decides
    beep(true); hint('Check, then Save or Retake'); renderLast();
  }
}

function clearOverlay(){ ov.getContext('2d').clearRect(0, 0, ov.width, ov.height); }
function drawOverlay(det, res, q){
  const c = ov.getContext('2d'); c.clearRect(0, 0, ov.width, ov.height);
  if (!det) return;
  const Hm = det.Hm, lw = Math.max(2, ov.width / 260);
  c.lineWidth = lw * 1.5; c.strokeStyle = res ? '#2ecc71' : '#f39c12';
  c.beginPath(); det.quad.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.stroke();
  if (!res) return;
  const L = layout(q);
  const rpx = (x, y) => { const a = project(Hm, x, y), b = project(Hm, x + BR, y); return [a, Math.hypot(b[0] - a[0], b[1] - a[1])]; };
  c.lineWidth = lw;
  L.id.forEach((col, ci) => { const d = res.sid[ci]; if (d === '?') return; const [p, r] = rpx(col[+d].x, col[+d].y); c.fillStyle = 'rgba(37,99,201,.65)'; c.beginPath(); c.arc(p[0], p[1], r * 1.15, 0, 7); c.fill(); });
  L.q.forEach((row, i) => {
    const a = res.answers[i], k = q.key[i] || '';
    row.forEach((b, j) => {
      const Lt = LETTERS[j], [p, r] = rpx(b.x, b.y);
      const marked = a === Lt || (a === '*' && res.qDark[i][j] >= (DB.settings.th || 0.25));
      if (marked){
        c.fillStyle = !k ? 'rgba(37,99,201,.65)' : (a !== '*' && k.includes(a)) ? 'rgba(46,204,113,.75)' : 'rgba(231,76,60,.75)';
        c.beginPath(); c.arc(p[0], p[1], r * 1.2, 0, 7); c.fill();
      } else if (k.includes(Lt) && !isRight(q, i, a)){
        c.strokeStyle = 'rgba(46,204,113,.95)'; c.beginPath(); c.arc(p[0], p[1], r * 1.3, 0, 7); c.stroke();
      }
    });
  });
  const sc = scoreOf(q, res.answers), [tl] = [det.quad[0]];
  const txt = `${sc.s}/${sc.t}`; c.font = `800 ${Math.round(ov.width / 12)}px system-ui,sans-serif`;
  const tw = c.measureText(txt).width, pad = ov.width / 60;
  c.fillStyle = 'rgba(0,0,0,.65)'; c.fillRect(ov.width - tw - pad * 3, pad, tw + pad * 2, ov.width / 12 + pad * 1.4);
  c.fillStyle = '#fff'; c.textBaseline = 'top'; c.fillText(txt, ov.width - tw - pad * 2, pad * 1.6);
}
const photoC = document.createElement('canvas');
async function shrinkPhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const im = new Image(); im.decoding = 'async';
    await new Promise((ok, bad) => { im.onload = ok; im.onerror = bad; im.src = url; });
    const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, HI_MAX / Math.max(w, h));
    photoC.width = Math.round(w * s); photoC.height = Math.round(h * s);
    photoC.getContext('2d').drawImage(im, 0, 0, photoC.width, photoC.height);
    im.src = ''; return photoC;
  } finally { URL.revokeObjectURL(url); }
}
async function onPhoto(file){
  if (!file) return;
  if (!DB.quizzes.length) return toast('Create a quiz first', true);
  hint('Reading photo…');
  let img, w, h;
  try{ img = await shrinkPhoto(file); w = img.width; h = img.height; }
  catch(e){ hint(''); toast('Couldn\'t open that photo. Try again or pick it from Photos.', true); return; }
  if (S.running) camStop();
  const s = Math.min(1, LO_MAX / Math.max(w, h)), lw = Math.round(w * s), lh = Math.round(h * s);
  sizeCanvases(lw, lh); camCtx.drawImage(img, 0, 0, lw, lh);
  $('#ph').style.display = 'none';
  const A = analyze(img, w, h);
  if (A.err){
    S.pending = null; renderLast();
    if (A.err === 'format'){ drawOverlay(A.det, null, null); hint(formatMsg(A.det.fmt, A.q)); toast('Sheet doesn\'t match the selected quiz', true); }
    else { clearOverlay(); hint('Couldn\'t find the 4 corner squares — retake closer, flat, with even light'); beep(false); }
    return;
  }
  drawOverlay(A.det, A.res, A.q);
  if (S.keyMode){ applyScannedKey(A); return; }
  S.pending = {quizId: A.q.id, sid: A.res.sid, answers: A.res.answers};
  hint('Check the marks, then Save');
  renderLast();
}

  const tx = (c, cx) => c.align === 'right' ? cx + c.w - 1.4 : c.align === 'center' ? cx + c.w / 2 : cx + 1.4;
  const header = () => {
    doc.rect(x, y, totalW, rowH + 0.8, {fill: '#e3eee7'});
    let cx = x; cols.forEach(c => { doc.text(c.t, tx(c, cx), y + rowH * 0.74 + 0.4, {size: size - 0.6, bold: true, align: c.align || 'left', maxW: c.w - 1.5}); cx += c.w; });
    y += rowH + 0.8;
  };

  rows.forEach((row, ri) => {
    if (y + rowH > bottom){ doc.page(); y = top; header(); }
    if (ri % 2) doc.rect(x, y, totalW, rowH, {fill: '#f5f5f1'});
    let cx = x;
    row.forEach((cell, ci) => {
      const c = cols[ci], o = cell !== null && typeof cell === 'object' ? cell : {t: cell};
      if (o.fill) doc.rect(cx + 0.3, y + 0.3, c.w - 0.6, rowH - 0.6, {fill: o.fill});
      doc.text(o.t, tx(c, cx), y + rowH * 0.7, {size, bold: o.bold, color: o.color || C_INK, align: c.align || 'left', maxW: c.w - 2});
      cx += c.w;
    });
    y += rowH;
  });
  doc.line(x, y, x + totalW, y, {stroke: '#bbbbbb', lw: 0.2});

function paperLegend(doc, y){
  const items = [
    [x => doc.circle(x, y - 1, 1.6, {fill: C_GREEN}), 'correct answer chosen'],
    [x => doc.circle(x, y - 1, 1.6, {fill: C_RED}), 'wrong answer chosen'],
    [x => doc.circle(x, y - 1, 2.1, {stroke: C_GREEN, lw: 0.45}), 'the right answer'],
    [x => doc.line(x - 2, y - 1, x + 2, y - 1, {stroke: C_RED, lw: 0.45}), 'more than one bubble marked'],
    [x => { doc.check(x - 1.3, y - 1, 0.8); doc.cross(x + 1.6, y - 1, 0.8); }, 'item score']];
  const sz = 7, widths = items.map(([, t]) => 6 + doc.tw(t, sz) + 5), total = widths.reduce((a, b) => a + b, 0);
  let x = (doc.W - total) / 2;
  items.forEach(([draw, t], i) => { draw(x + 2); doc.text(t, x + 5, y, {size: sz, color: C_GRAY}); x += widths[i]; });
}
async function makePapersPDF(q, recs, {paper, summary}){

function finishPages(doc, q, extra){

  doc.pages.forEach((pg, i) => {
    doc.c = pg;
    const fx = extra && extra(i); if (fx) fx();

/* item analysis numbers */
const pLabel = p => p >= 0.81 ? 'Very easy' : p >= 0.61 ? 'Easy' : p >= 0.41 ? 'Average' : p >= 0.21 ? 'Difficult' : 'Very difficult';
const dLabel = d => d === null ? '—' : d >= 0.40 ? 'Very good' : d >= 0.30 ? 'Good' : d >= 0.20 ? 'Fair' : d >= 0 ? 'Poor' : 'Negative';
function remarkOf(p, d){
  if (d === null) return '—';
  if (d < 0) return 'Reject';
  const a = p >= 0.21 && p <= 0.80, b = d >= 0.20;
  return a && b ? 'Retain' : a || b ? 'Revise' : 'Reject';
}
function analysisData(q, recs){
  const n = recs.length, tots = recs.map(r => scoreOf(q, r.answers).s);
  const g = Math.max(1, Math.round(n * 0.27)), order = tots.map((_, i) => i).sort((a, b) => tots[b] - tots[a]);
  const U = new Set(order.slice(0, g)), Lo = new Set(order.slice(n - g));
  const items = itemStats(q, recs).filter(s => s.key).map(s => {
    let ru = 0, rl = 0;
    recs.forEach((r, ri) => { if (isRight(q, s.i, r.answers[s.i] || '')){ if (U.has(ri)) ru++; if (Lo.has(ri)) rl++; } });
    const p = n ? s.ok / n : 0, d = n >= 4 ? (ru - rl) / g : null;
    return {...s, p, d, ru, rl, remark: remarkOf(p, d)};
  });
  const cs = classStats(q, recs), k = items.length;
  const kr20 = k > 1 && n > 1 && cs.v > 0 ? (k / (k - 1)) * (1 - items.reduce((a, it) => a + it.p * (1 - it.p), 0) / cs.v) : null;
  return {items, g, n, cs, kr20};
}
const remarkColor = r => r === 'Retain' ? C_GREEN : r === 'Revise' ? C_ORANGE : r === 'Reject' ? C_RED : C_GRAY;
function drawHistogram(doc, x, y, w, h, tots, t){
  doc.text('Score distribution', x, y, {size: 9.5, bold: true});
  y += 3;
  const maxS = Math.max(t, ...tots, 1); let bw = 1;
  while ((maxS + 1) / bw > 26) bw++;
  const nb = Math.floor(maxS / bw) + 1, counts = Array(nb).fill(0);
  tots.forEach(s => counts[Math.floor(s / bw)]++);
  const cmax = Math.max(1, ...counts), gh = h - 9, base = y + gh, slot = w / nb, barW = Math.min(slot * 0.74, 9);
  doc.rect(x, y, w, gh, {fill: '#fafbfa'});
  doc.line(x, base, x + w, base, {stroke: '#888888', lw: 0.25});
  const step = Math.ceil(String(maxS).length * 1.6 / slot + 0.0001);
  counts.forEach((c, i) => {
    const cx = x + slot * i + slot / 2, bh = c / cmax * (gh - 5);
    if (c) { doc.rect(cx - barW / 2, base - bh, barW, bh, {fill: '#2f8a5b'}); doc.text(String(c), cx, base - bh - 1, {size: 6.5, align: 'center', color: C_INK}); }
    if (i % Math.max(1, step) === 0) doc.text(bw === 1 ? String(i) : `${i * bw}–${i * bw + bw - 1}`, cx, base + 3.4, {size: 6.2, align: 'center', color: C_GRAY});
  });
  doc.text(`Score (out of ${t})  ·  bar = number of papers`, x + w, base + 7.4, {size: 6.5, color: C_GRAY, align: 'right'});
  return base + 9;
}
async function makeAnalysisPDF(q, recs, {paper}){
  const doc = new PDFDoc(paper), M = 12, W = doc.W - 2 * M, A = analysisData(q, recs), cs = A.cs, bottom = doc.H - 14;
  doc.page();
  let y = 17;
  doc.text('Item Analysis', M, y, {size: 16, bold: true}); y += 6.5;
  doc.text(q.name, M, y, {size: 11, maxW: W}); y += 5;
  doc.text(`${fmtLabel(q)}  ·  ${A.items.length} keyed items  ·  ${A.n} paper${A.n === 1 ? '' : 's'}  ·  created ${new Date().toLocaleString()}`, M, y, {size: 8, color: C_GRAY, maxW: W}); y += 5;
  statBoxes(doc, M, y, W, [['Papers', String(A.n)], ['Mean', `${f1(cs.mean)} / ${cs.t}`], ['Median', f1(cs.median)], ['Std. dev.', A.n > 1 ? cs.sd.toFixed(2) : '–'], ['Highest', String(cs.hi)], ['Lowest', String(cs.lo)], ['Reliability KR-20', A.kr20 === null ? '–' : A.kr20.toFixed(2)]]);
  y += 21;
  y = drawHistogram(doc, M, y, W, 40, cs.tots, cs.t) + 3;
  doc.text(A.n >= 4 ? `Upper and lower groups = top and bottom 27% of papers by total score (${A.g} papers each).  p = proportion who got the item right.  D = (upper right - lower right) ÷ ${A.g}.`
    : 'Discrimination needs at least 4 papers, so D and remarks are left blank.', M, y, {size: 7.2, color: C_GRAY, maxW: W});
  y += 4;
  const opts = LETTERS.slice(0, q.choices).split('');
  const cols = scaleCols([{t: 'Item', w: 11, align: 'center'}, {t: 'Key', w: 10, align: 'center'}, ...opts.map(l => ({t: l, w: 10, align: 'center'})), {t: 'Blank', w: 11, align: 'center'}, {t: '2+', w: 9, align: 'center'},
    {t: 'p', w: 11, align: 'right'}, {t: 'Difficulty', w: 22}, {t: 'D', w: 12, align: 'right'}, {t: 'Discrimination', w: 24}, {t: 'Remark', w: 17}], W);
  const rows = A.items.map(it => [
    {t: String(it.i + 1), bold: true}, {t: it.key, bold: true, color: C_GREEN},
    ...opts.map(l => it.key.includes(l) ? {t: String(it.cnt[l] || 0), bold: true, fill: '#d9eedf'} : {t: String(it.cnt[l] || 0), color: (it.cnt[l] || 0) ? C_INK : '#a0a0a0'}),
    {t: String(it.blank), color: it.blank ? C_INK : '#a0a0a0'}, {t: String(it.multi), color: it.multi ? C_INK : '#a0a0a0'},
    it.p.toFixed(2), pLabel(it.p), it.d === null ? '—' : it.d.toFixed(2), dLabel(it.d), {t: it.remark, bold: true, color: remarkColor(it.remark)}]);
  y = pdfTable(doc, cols, rows, {x: M, y, bottom, size: 8.2, rowH: 5.3});
  // summary + legend
  const by = r => A.items.filter(it => it.remark === r).map(it => it.i + 1);
  const legend = [
    ['Difficulty (p):', '0.81–1.00 very easy · 0.61–0.80 easy · 0.41–0.60 average · 0.21–0.40 difficult · 0.00–0.20 very difficult'],
    ['Discrimination (D):', '0.40 and up very good · 0.30–0.39 good · 0.20–0.29 fair · 0.00–0.19 poor · below 0 negative (check the key)'],
    ['Remark:', 'Retain = p is 0.21–0.80 and D is 0.20 or more · Revise = only one of the two is met · Reject = neither is met, or D is negative'],
    ['Options:', 'counts per choice; the shaded cell is the key. A wrong option nobody picked is not working as a distractor.']];
  const needed = 12 + legend.length * 4.6 + 8;
  if (y + needed > bottom){ doc.page(); y = 15; } else y += 6;
  const sumLine = (label, list, color) => {
    doc.text(label, M, y, {size: 8.5, bold: true, color});
    doc.text(list.length ? `${list.length} item${list.length === 1 ? '' : 's'}${label === 'Retain' ? '' : ': ' + list.join(', ')}` : 'none', M + 15, y, {size: 8.5, maxW: W - 15});
    y += 4.6;
  };
  if (A.n >= 4){ sumLine('Retain', by('Retain'), C_GREEN); sumLine('Revise', by('Revise'), C_ORANGE); sumLine('Reject', by('Reject'), C_RED); y += 2; }
  legend.forEach(([a, b]) => { doc.text(a, M, y, {size: 7.2, bold: true, color: C_GRAY}); doc.text(b, M + 27, y, {size: 7.2, color: C_GRAY, maxW: W - 27}); y += 4.2; });
  finishPages(doc, q);
  return {bytes: await doc.bytes(q.name + ' – item analysis'), pages: doc.pages.length};
}

function parseRoster(text){
  const out = {};

    const m = line.replace(/^﻿/, '').match(/^\s*"?([0-9A-Za-z\-]+)"?\s*[,\t;]\s*(.+?)\s*$/);
    if (m && !/^(id|student)/i.test(m[1])) out[m[1].replace(/-/g, '')] = m[2].replace(/^"|"$/g, '').replace(/"\s*[,\t;]\s*"/g, ', ').replace(/\t/g, ' ').trim();
  });
  return out;
}

      const q = quizById(modalState.id), s = $('#keyTxt').value.toUpperCase().replace(/[^A-E]/g, '');
      const ok = LETTERS.slice(0, q.choices);
      if ([...s].some(c => !ok.includes(c))) return toast(`Only ${ok.split('').join(', ')} allowed`, true);
      [...s].slice(0, q.n).forEach((c, i) => q.key[i] = c); persist(); drawKeyGrid(); toast(`${Math.min(s.length, q.n)} items set`); break;
    }
    case 'keyClear': { if (!confirm('Clear the whole key?')) return; const q = quizById(modalState.id); q.key = Array(q.n).fill(''); persist(); drawKeyGrid(); break; }
    case 'keyScan': setCurrentQuiz(id); S.keyMode = id; closeModal(); show('scan'); break;
    case 'cancelKeyMode': S.keyMode = null; $('#keyModeBanner').style.display = 'none'; break;
    case 'printSheets': printSheets(id); break;
    case 'doPrintSheets': doPrintSheets(id); break;
    case 'goScan': setCurrentQuiz(id); show('scan'); break;
    case 'goResults': setCurrentQuiz(id); show('results'); break;
    case 'camStart': camStart(); break;
    case 'camStop': camStop(); break;
    case 'torch': toggleTorch(); break;
    case 'snap': $('#photoIn').click(); break;
    case 'lib': $('#libIn').click(); break;
    case 'savePending': savePending(false); if (!S.running) hint(''); break;
    case 'saveNext': savePending(false); hint(''); $('#' + S.photoSrc).click(); break;
    case 'retake': S.pending = null; S.stableN = 0; S.frozenUntil = 0; renderLast(); clearOverlay(); hint(S.running ? 'Fit all 4 corner squares in view' : ''); if (!S.running){ $('#ph').style.display = ''; $('#' + S.photoSrc).click(); } break;
    case 'openRec': openRec(id); break;
    case 'undoRec': case 'delRec': {
      if (act === 'delRec' && !confirm('Delete this result?')) return;
      DB.results = DB.results.filter(r => r.id !== id); persist();
      if (S.last_rec === id){ S.last_rec = null; S.lastSavedSid = null; S.session = Math.max(0, S.session - (act === 'undoRec' ? 1 : 0)); S.armed = true; }
      if (act === 'delRec') closeModal(); toast('Removed'); updateSession(); refresh(); break;
    }
    case 'exportCSV': exportCSV(); break;
    case 'pdfMenu': pdfMenu(el.dataset.kind, id); break;
    case 'pdfMake': pdfMake(el.dataset.kind, id, el); break;
    case 'pdfDl': pdfDownload(); break;
    case 'pdfShare': pdfShare(); break;
    case 'pdfOpen': pdfOpen(); break;
    case 'printReport': printReport(); break;
    case 'doPrintReport': doPrintReport(); break;
    case 'saveRoster': DB.roster = parseRoster($('#roster').value); persist(); toast(`${Object.keys(DB.roster).length} students saved`); renderMore(); break;
    case 'importRoster': fileAction = 'roster'; $('#fileIn').accept = '.csv,.txt,text/csv,text/plain'; $('#fileIn').click(); break;
    case 'backup': download(`bubblecheck_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(DB), 'application/json'); break;
    case 'restore': fileAction = 'restore'; $('#fileIn').accept = '.json,application/json'; $('#fileIn').click(); break;
    case 'wipe': if (confirm('Erase ALL quizzes, results and roster on this device?') && confirm('Really erase everything? This can\'t be undone.')){ DB = blankDB(); persist(); renderMore(); toast('Erased'); } break;
  }
});

/* test hook */
window.BubbleCheck = {layout, sheetSVG, detectSheet, gradeSheet, toGray, codeBits, parseCode, scoreOf, get DB(){ return DB; }, analyzeImage: async (url, q) => {
  const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
  const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(1, LO_MAX / Math.max(w, h));
  sizeCanvases(Math.round(w * s), Math.round(h * s)); camCtx.drawImage(im, 0, 0, cam.width, cam.height);
  if (q){ DB.quizzes = DB.quizzes.filter(z => z.id !== q.id); DB.quizzes.push(q); setCurrentQuiz(q.id); }
  const A = analyze(im, w, h); return A.err ? {err: A.err, fmt: A.det && A.det.fmt} : {sid: A.res.sid, answers: A.res.answers};
}};

show(DB.quizzes.length ? 'quizzes' : 'quizzes');

/* offline support when served over https */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
